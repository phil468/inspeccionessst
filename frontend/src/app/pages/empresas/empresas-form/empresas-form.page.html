<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/empresas"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar Empresa' : 'Nueva Empresa' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="empresaForm" (ngSubmit)="guardar()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Nombre *"
          labelPlacement="stacked"
          formControlName="name"
          placeholder="Ingrese el nombre"
          [clearInput]="true"
        ></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="empresaForm.get('name')?.invalid && empresaForm.get('name')?.touched">
        El nombre es requerido
      </ion-note>

      <ion-item>
        <ion-input
          label="Razón Social"
          labelPlacement="stacked"
          formControlName="razon_social"
          placeholder="Ingrese la razón social"
          [clearInput]="true"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="RUC"
          labelPlacement="stacked"
          formControlName="ruc"
          placeholder="Ingrese el RUC (11 dígitos)"
          type="tel"
          maxlength="11"
          [clearInput]="true"
        ></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="empresaForm.get('ruc')?.invalid && empresaForm.get('ruc')?.touched">
        El RUC debe tener 11 dígitos
      </ion-note>

      <ion-item>
        <ion-textarea
          label="Domicilio"
          labelPlacement="stacked"
          formControlName="domicilio"
          placeholder="Ingrese el domicilio"
          rows="2"
        ></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-input
          label="Actividad Económica"
          labelPlacement="stacked"
          formControlName="actividad_economica"
          placeholder="Ingrese la actividad económica"
          [clearInput]="true"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-toggle formControlName="activo">Activo</ion-toggle>
      </ion-item>
    </ion-list>

    <div class="ion-padding">
      <ion-button expand="block" type="submit" [disabled]="!isOnline || empresaForm.invalid">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="cancelar()">
        Cancelar
      </ion-button>
    </div>
  </form>
</ion-content>
