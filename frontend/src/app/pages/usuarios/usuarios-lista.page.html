<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Usuarios</ion-title>
    <ion-buttons slot="end" *ngIf="hasPermission('users.manage')">
      <ion-button (click)="nuevo()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterUsuarios()"
      placeholder="Buscar usuario..."
      debounce="300"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadUsuarios()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="!isLoading && usuariosFiltrados.length > 0">
    <ion-item *ngFor="let usuario of usuariosFiltrados" lines="full">
      <ion-label>
        <h2>{{ usuario.name }}</h2>
        <p>{{ usuario.email }}</p>
        <p class="ion-text-wrap" *ngIf="usuario.roles && usuario.roles.length > 0">
          <ion-badge color="primary" *ngFor="let rol of usuario.roles" class="rol-badge">
            {{ rol.name }}
          </ion-badge>
        </p>
        <p>
          <ion-badge [color]="usuario.activo ? 'success' : 'danger'">
            {{ usuario.activo ? 'Activo' : 'Inactivo' }}
          </ion-badge>
        </p>
      </ion-label>
      <ion-buttons slot="end" *ngIf="hasPermission('users.manage')">
        <ion-button fill="clear" color="primary" (click)="editar(usuario.id!)">
          <ion-icon name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="eliminar(usuario)">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
  <div *ngIf="!isLoading && usuariosFiltrados.length === 0" class="empty-state">
    <ion-icon name="people-outline" class="empty-icon"></ion-icon>
    <h2>No hay usuarios</h2>
    <p>{{ searchTerm ? 'No se encontraron resultados' : 'Agrega el primer usuario' }}</p>
    <ion-button *ngIf="!searchTerm && hasPermission('users.manage')" (click)="nuevo()">
      <ion-icon slot="start" name="add"></ion-icon>
      Nuevo Usuario
    </ion-button>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <ion-spinner></ion-spinner>
    <p>Cargando usuarios...</p>
  </div>
</ion-content>
