<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Editar Registro' : 'Nuevo Registro' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list>
      <!-- Campaña -->
      <ion-item>
        <ion-select 
          label="Campaña" 
          labelPlacement="floating"
          formControlName="campania_id"
          interface="action-sheet"
          placeholder="Seleccione una campaña">
          <ion-select-option *ngFor="let campania of campanias" [value]="campania.id">
            {{ campania.nombre }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Sede -->
      <ion-item>
        <ion-select 
          label="Sede" 
          labelPlacement="floating"
          formControlName="fundo_id"
          interface="action-sheet"
          placeholder="Seleccione una sede">
          <ion-select-option *ngFor="let fundo of fundos" [value]="fundo.id">
            {{ fundo.nombre }}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Cantidad -->
      <ion-item>
        <ion-input 
          label="Cantidad" 
          labelPlacement="floating"
          type="number"
          formControlName="cantidad"
          placeholder="0.00"
          step="0.01"
          min="0">
        </ion-input>
      </ion-item>

      <!-- Número de Tractor -->
      <ion-item>
        <ion-input 
          label="Número de Tractor" 
          labelPlacement="floating"
          type="text"
          formControlName="numero_tractor"
          placeholder="Ej: T-001">
        </ion-input>
      </ion-item>

      <!-- Observaciones -->
      <ion-item>
        <ion-textarea 
          label="Observaciones" 
          labelPlacement="floating"
          formControlName="observaciones"
          rows="4"
          placeholder="Observaciones adicionales (opcional)">
        </ion-textarea>
      </ion-item>
    </ion-list>

    <div class="button-container">
      <ion-button 
        expand="block" 
        type="submit"
        [disabled]="registroForm.invalid">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        Guardar Registro
      </ion-button>
    </div>
  </form>
</ion-content>
