<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Motivos</ion-title>
    <ion-buttons slot="end" *ngIf="hasPermission('motivos.create')">
      <ion-button (click)="nuevoMotivo()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterMotivos($event)"
      placeholder="Buscar motivo"
      animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadMotivos()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="!loading && motivosFiltrados.length > 0">
    <ion-item *ngFor="let motivo of motivosFiltrados">
      <ion-label>
        <h2>{{ motivo.nombre }}</h2>
        <p *ngIf="motivo.descripcion">{{ motivo.descripcion }}</p>
        <p class="ion-text-wrap">
          <ion-badge [color]="motivo.activo ? 'success' : 'danger'">
            {{ motivo.activo ? 'Activo' : 'Inactivo' }}
          </ion-badge>
        </p>
      </ion-label>
      
      <ion-buttons slot="end" *ngIf="hasPermission('motivos.update') || hasPermission('motivos.delete')">
        <ion-button fill="clear" color="primary" (click)="editarMotivo(motivo.id)" *ngIf="hasPermission('motivos.update')">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="eliminarMotivo(motivo)" *ngIf="hasPermission('motivos.delete')">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <div class="empty-state" *ngIf="!loading && motivosFiltrados.length === 0">
    <ion-icon name="search-outline" size="large"></ion-icon>
    <h2>No hay motivos</h2>
    <p *ngIf="searchTerm">No se encontraron resultados para "{{ searchTerm }}"</p>
    <p *ngIf="!searchTerm">Aún no hay motivos registrados</p>
    <ion-button (click)="nuevoMotivo()" *ngIf="hasPermission('motivos.create') && !searchTerm">
      <ion-icon slot="start" name="add"></ion-icon>
      Nuevo Motivo
    </ion-button>
  </div>

  <ion-spinner *ngIf="loading" name="crescent" class="center-spinner"></ion-spinner>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end" *ngIf="hasPermission('motivos.create')">
    <ion-fab-button (click)="nuevoMotivo()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
