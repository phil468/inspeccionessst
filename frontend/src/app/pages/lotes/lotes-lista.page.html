<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Lotes</ion-title>
    <ion-buttons slot="end" *ngIf="hasPermission('lotes.create')">
      <ion-button (click)="nuevoLote()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterLotes($event)"
      placeholder="Buscar lote"
      animated>
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadLotes()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="!loading && lotesFiltrados.length > 0">
    <ion-item *ngFor="let lote of lotesFiltrados">
      <ion-label>
        <h2>{{ lote.nombre }}</h2>
        <p *ngIf="lote.fundo">Fundo: {{ lote.fundo.nombre }}</p>
        <p class="ion-text-wrap">
          <ion-badge [color]="lote.activo ? 'success' : 'danger'">
            {{ lote.activo ? 'Activo' : 'Inactivo' }}
          </ion-badge>
        </p>
      </ion-label>
      
      <ion-buttons slot="end" *ngIf="hasPermission('lotes.update') || hasPermission('lotes.delete')">
        <ion-button fill="clear" color="primary" (click)="editarLote(lote.id)" *ngIf="hasPermission('lotes.update')">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" color="danger" (click)="eliminarLote(lote)" *ngIf="hasPermission('lotes.delete')">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>

  <div class="empty-state" *ngIf="!loading && lotesFiltrados.length === 0">
    <ion-icon name="search-outline" size="large"></ion-icon>
    <h2>No hay lotes</h2>
    <p *ngIf="searchTerm">No se encontraron resultados para "{{ searchTerm }}"</p>
    <p *ngIf="!searchTerm">Aún no hay lotes registrados</p>
    <ion-button (click)="nuevoLote()" *ngIf="hasPermission('lotes.create') && !searchTerm">
      <ion-icon slot="start" name="add"></ion-icon>
      Nuevo Lote
    </ion-button>
  </div>

  <ion-spinner *ngIf="loading" name="crescent" class="center-spinner"></ion-spinner>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end" *ngIf="hasPermission('lotes.create')">
    <ion-fab-button (click)="nuevoLote()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
