<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-container">
      <ion-icon name="shield-checkmark-sharp" class="logo-icon"></ion-icon>
      <h1>SST</h1>
      <p>Sistema de Inspecciones</p>
    </div>

    <div class="login-card">
      <h2>Iniciar Sesión</h2>

      <!-- Botón de Microsoft -->
      <ion-button 
        expand="block" 
        (click)="loginWithMicrosoft()"
        [disabled]="loading"
        class="microsoft-button"
        fill="outline">
        <ion-icon slot="start" name="logo-microsoft"></ion-icon>
        <span>Iniciar con Microsoft</span>
      </ion-button>

      <div class="info-text">
        <ion-icon name="information-circle-outline"></ion-icon>
        <p>Usa tu cuenta corporativa o credenciales proporcionadas</p>
      </div>

      <!-- Divisor -->
      <div class="divider">
        <span>O</span>
      </div>

      <!-- Formulario de email + password -->
      <form (ngSubmit)="loginWithCredentials()">
        <ion-item lines="full">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input
            type="email"
            placeholder="Correo electrónico"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="loading">
          </ion-input>
        </ion-item>

        <ion-item lines="full">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Contraseña"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="loading">
          </ion-input>
          <ion-button 
            slot="end" 
            fill="clear" 
            (click)="togglePasswordVisibility()"
            type="button">
            <ion-icon 
              slot="icon-only" 
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'">
            </ion-icon>
          </ion-button>
        </ion-item>

        <ion-button 
          expand="block" 
          type="submit"
          [disabled]="loading || !email || !password"
          class="login-button">
          <span *ngIf="!loading">Iniciar Sesión</span>
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        </ion-button>
      </form>

    </div>

    <div class="footer">
      <p>Grupo Vanguard Internacional © {{ currentYear }} </p>
    </div>
  </div>
</ion-content>
