<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="registro-form">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Nuevo</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="registro-lista">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Registros</ion-label>
    </ion-tab-button>

    <ion-tab-button class="menu-tab-button" (click)="openMenu(); $event.preventDefault()">
      <ion-icon name="ellipsis-vertical-outline"></ion-icon>
      <ion-label>Menú</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
