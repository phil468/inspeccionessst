<!-- Backdrop del menú -->
<div class="menu-backdrop" [class.active]="isMenuOpen" (click)="closeMenu()"></div>

<!-- Panel del menú lateral -->
<div class="side-menu" [class.open]="isMenuOpen">
  <div class="menu-header">
    <div class="user-info">
      <ion-icon name="person-circle-outline" class="user-avatar"></ion-icon>
      <span class="user-name">{{ userName }}</span>
    </div>
    <ion-button fill="clear" (click)="closeMenu()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="menu-content">
    <div class="menu-item" (click)="navigateTo('/home')">
      <ion-icon name="home-outline"></ion-icon>
      <span>Inicio</span>
    </div>
    <div class="menu-item" (click)="navigateTo('/registro-lista')">
      <ion-icon name="list-outline"></ion-icon>
      <span>Registros</span>
    </div>
    <div class="menu-item" (click)="navigateTo('/inspecciones')">
      <ion-icon name="document-text-outline"></ion-icon>
      <span>Inspecciones</span>
    </div>
    <div class="menu-item" (click)="navigateTo('/mis-inspecciones')">
      <ion-icon name="clipboard-outline"></ion-icon>
      <span>Mis Inspecciones</span>
    </div>

    <div class="menu-section">Mantenimiento</div>
    <div class="menu-item sub" *ngIf="hasPermission('campanias.view')" (click)="navigateTo('/campanias')">
      <ion-icon name="flask-outline"></ion-icon>
      <span>Campañas</span>
    </div>
    <div class="menu-item sub" *ngIf="hasPermission('fundos.view')" (click)="navigateTo('/fundos')">
      <ion-icon name="business-outline"></ion-icon>
      <span>Fundos</span>
    </div>
    <div class="menu-item sub" *ngIf="hasPermission('empresas.view')" (click)="navigateTo('/empresas')">
      <ion-icon name="briefcase-outline"></ion-icon>
      <span>Empresas</span>
    </div>
    <div class="menu-item sub" *ngIf="hasPermission('areas.view')" (click)="navigateTo('/areas')">
      <ion-icon name="layers-outline"></ion-icon>
      <span>Áreas</span>
    </div>
    <div class="menu-item sub" *ngIf="hasPermission('personal.view')" (click)="navigateTo('/personal')">
      <ion-icon name="people-outline"></ion-icon>
      <span>Personal</span>
    </div>

    <div class="menu-section">Administración</div>
    <div class="menu-item sub" *ngIf="hasPermission('users.manage')" (click)="navigateTo('/usuarios')">
      <ion-icon name="people-outline"></ion-icon>
      <span>Usuarios</span>
    </div>
    <div class="menu-item sub" *ngIf="hasPermission('roles.manage')" (click)="navigateTo('/roles')">
      <ion-icon name="key-outline"></ion-icon>
      <span>Roles y Permisos</span>
    </div>
  </div>

  <div class="menu-footer">
    <ion-button expand="block" color="danger" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>
</div>

<!-- Tabs normales -->
<ion-tabs>
  <ion-tab-bar slot="bottom" class="ion-no-border">
    <ion-tab-button (click)="navigateTo('/home')">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="navigateTo('/inspecciones/form')">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Nueva</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="navigateTo('/inspecciones')">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Inspecciones</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="toggleMenu()">
      <ion-icon name="menu-outline"></ion-icon>
      <ion-label>Menú</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
