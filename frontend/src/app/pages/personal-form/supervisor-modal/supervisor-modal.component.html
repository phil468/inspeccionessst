<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Seleccionar Supervisor</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filterPersonal()"
      placeholder="Buscar por nombre o DNI..."
      debounce="300"
      animated
    ></ion-searchbar>
  </ion-toolbar>

  <ion-toolbar>
    <ion-chip color="primary">
      <ion-label>
        {{ personalFiltrado.length }} {{ personalFiltrado.length === 1 ? 'resultado' : 'resultados' }}
      </ion-label>
    </ion-chip>
    <ion-chip color="medium" *ngIf="personalMostrado.length < personalFiltrado.length">
      <ion-label>
        Mostrando: {{ personalMostrado.length }} de {{ personalFiltrado.length }}
      </ion-label>
    </ion-chip>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Lista con scroll infinito -->
  <ion-list>
    <ion-item
      *ngFor="let p of personalMostrado"
      button
      (click)="selectPersonal(p)"
      detail="false"
    >
      <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h2>{{ p.name }}</h2>
        <p *ngIf="p.dni">DNI: {{ p.dni }}</p>
      </ion-label>
    </ion-item>

    <!-- Sin resultados -->
    <ion-item *ngIf="personalFiltrado.length === 0" lines="none">
      <ion-label class="ion-text-center" color="medium">
        <p>No se encontraron resultados</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Scroll infinito -->
  <ion-infinite-scroll
    threshold="100px"
    (ionInfinite)="onIonInfinite($event)"
    *ngIf="personalMostrado.length < personalFiltrado.length"
  >
    <ion-infinite-scroll-content
      loadingSpinner="crescent"
      loadingText="Cargando más...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
